spring:
  application:
    name: task
  datasource:
    url: jdbc:postgresql://localhost:5432/tasklist?currentSchema=tasklist
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS tasklist
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql
      data-locations: classpath:demo_data.sql
      continue-on-error: false
  liquibase:
    change-log: classpath:liquibase/db.changelog.yaml
    enabled: true
    default-schema: tasklist
    liquibase-schema: tasklist
security:
  jwt:
    secret: YXNkYXNkenhkMTIzMTI0MzIhfn4xIUA0MTI0cWYxMzIzZjJ0
    access: 3600000
    refresh: 2592000000
springdoc:
  override-with-generic-response: false